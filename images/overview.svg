<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc"><title id="title">USB environmental sensor functional connections</title><desc id="desc">USB-A data connects through ESD protection to the BMD-340 nRF52840 module. A 3.3 V regulator supplies the module and sensors. Three sensors share I2C; the microphone uses PDM. USB and Bluetooth LE transport need application firmware.</desc><defs><style>text{font-family:Helvetica,Arial,sans-serif;fill:#222}.node{font-size:27px;text-anchor:middle}.detail{font-size:21px;fill:#555;text-anchor:middle}.box{fill:#fafafa;stroke:#333;stroke-width:2}.link{fill:none;stroke:#333;stroke-width:2}.power{fill:none;stroke:#333;stroke-width:2;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#333" stroke-width="1.5"/></marker></defs><rect width="1600" height="620" fill="white"/><rect x="40" y="80" width="280" height="240" class="box"/><text x="180.0" y="197.0" class="node">USB-A</text><text x="180.0" y="227.0" class="detail">5 V / USB Full Speed</text><rect x="420" y="80" width="260" height="80" class="box"/><text x="550.0" y="129.0" class="node">ESD protection</text><rect x="420" y="240" width="260" height="80" class="box"/><text x="550.0" y="289.0" class="node">3.3 V regulator</text><rect x="820" y="80" width="340" height="240" class="box"/><text x="990.0" y="197.0" class="node">BMD-340</text><text x="990.0" y="227.0" class="detail">nRF52840 MCU</text><rect x="1300" y="80" width="260" height="90" class="box"/><text x="1430.0" y="122.0" class="node">Bluetooth LE</text><text x="1430.0" y="152.0" class="detail">Firmware required</text><path d="M320 120 H420 M680 120 H820" class="link"/><path d="M320 280 H412" class="power"/><path d="M680 280 H812" class="power"/><path d="M1160 125 H1300" class="link"/><rect x="40" y="450" width="350" height="100" class="box"/><text x="215.0" y="497.0" class="node">BME688</text><text x="215.0" y="527.0" class="detail">Temperature / RH / pressure / gas</text><rect x="460" y="450" width="280" height="100" class="box"/><text x="600.0" y="497.0" class="node">OPT3001</text><text x="600.0" y="527.0" class="detail">Ambient light</text><rect x="810" y="450" width="330" height="100" class="box"/><text x="975.0" y="497.0" class="node">LIS2DW12</text><text x="975.0" y="527.0" class="detail">Three-axis acceleration</text><rect x="1250" y="450" width="310" height="100" class="box"/><text x="1405.0" y="497.0" class="node">IM69D128S</text><text x="1405.0" y="527.0" class="detail">PDM microphone</text><path d="M990 320 V390 H215 V450 M600 390 V450 M975 390 V450" class="link"/><path d="M1160 265 H1405 V450" class="link"/><text x="610" y="373" class="detail">I²C bus</text><text x="1405" y="247" class="detail">PDM</text><text x="990" y="600" class="detail">3.3 V domain: MCU and sensors</text></svg>